# Tool configuration for the Ethara backend.
#
# There is no [build-system] here on purpose: this is a deployed application,
# not a published package. Runtime dependencies live in requirements.txt and
# dev/CI tooling in requirements-dev.txt; this file only configures the tools.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
# Ratchet, not a target. Raise it when coverage genuinely improves; never lower
# it to make a run pass. The headline number is held down by app/seed/, which is
# one-off CLI tooling verified by `python -m app.seed.verify` rather than pytest.
fail_under = 70
exclude_also = [
    "if __name__ == .__main__.:",
]

# --- ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py314"
# Alembic writes these; reformatting generated migrations only creates diff noise
# and the schema they encode is already applied in production.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import ordering
    "UP",   # pyupgrade — keep syntax current with the pinned Python
    "B",    # bugbear — real bug patterns, not style
    "C4",   # comprehension clarity
    "SIM",  # simplifications
    "RUF",  # ruff's own checks
]
ignore = [
    # Ambiguous-unicode. These fire on "5 floors × 2 zones" and "79–95% occupied"
    # in prose, which is correct typography, not a homoglyph attack. Worse, one
    # hit is ai_nl.py's house-copy rule .replace("–", "-"): "fixing" that would
    # rewrite it to .replace("-", "-") and silently turn the rule into a no-op.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on behaviour, not on line width.
"tests/*" = ["E501"]
# UP037 wants to unquote Mapped["Project"]. Those names are imported under
# TYPE_CHECKING and do not exist at runtime; the quoted form is SQLAlchemy's
# documented idiom and lets the declarative registry resolve them by name.
# Unquoted, it happens to survive only because PEP 649 defers annotations on
# 3.14 — that is luck, not design.
"app/models/*" = ["UP037"]
# The Groq system prompts are tuned literals. Rewrapping them to satisfy a line
# limit changes what the model actually reads, so width is not ours to enforce.
"app/services/ai_nl.py" = ["E501"]

# --- mypy -------------------------------------------------------------------
# Staged strictness, deliberately. app/core and app/services hold the business
# rules and the Groq fallback logic — the code where a wrong type is a real bug —
# so they run under the strict flag set. app/api is thin FastAPI glue whose types
# are largely inferred from Pydantic schemas and Depends() injection, so it runs
# at the default level for now.
# Staged plan: app/api next (it needs return annotations on every route), then
# app/seed, then flip the global default to strict and delete the overrides.

[tool.mypy]
python_version = "3.14"
files = ["app"]
exclude = "alembic/versions"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["app.core.*", "app.services.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
strict_equality = true
extra_checks = true
