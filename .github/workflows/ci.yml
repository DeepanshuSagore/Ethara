name: CI

# Gates every push and PR: lint, types, then the suite against BOTH engines.
# The Postgres tier is the one that matters — production runs Postgres, so a
# SQLite-only pass would only prove the development schema works.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: lint, types, tests (SQLite + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Same major as production, so CI disagreeing with prod is one less
        # thing a failure can mean.
        image: postgres:17
        env:
          POSTGRES_USER: ethara
          POSTGRES_PASSWORD: ethara
          POSTGRES_DB: ethara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ethara -d ethara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to the series the psycopg[binary] wheels target, matching
          # the Dockerfile.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Lint and types run before the suite deliberately: a style or typing
      # failure should cost seconds, not the full Postgres run.
      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy

      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ethara:ethara@localhost:5432/ethara_test
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Seed and verify against Postgres
        # app/seed is the part pytest does not cover, and its setval() on the
        # identity sequences is Postgres-only. verify exits non-zero if any
        # §5b target or invariant fails.
        # A separate database, not ethara_test: the suite's teardown drops the
        # mapped tables but not alembic_version, so a migration run afterwards
        # would report itself up to date against tables that no longer exist.
        env:
          PGPASSWORD: ethara
          DATABASE_URL: postgresql+psycopg://ethara:ethara@localhost:5432/ethara_seed
        run: |
          psql -h localhost -U ethara -d postgres -c "CREATE DATABASE ethara_seed OWNER ethara;"
          alembic upgrade head
          python -m app.seed.run
