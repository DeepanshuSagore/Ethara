name: Keep Render awake (backup)

# SECONDARY pinger only. The primary keep-alive is a cron-job.org job that hits
# /health every 10 minutes, 23 h/day — see DEPLOYMENT.md §8.
#
# This workflow used to be the primary, pinging in a 45-minute sleep loop. That
# was dropped: GitHub throttles shared-runner crons hard (measured on this repo:
# median 136 min between fires, worst case 739 min), so it could never actually
# close the 15-minute idle window, and holding a runner open to sleep is poor
# citizenship on free infrastructure. It stays as a cheap safety net in case the
# external pinger ever stops — one request per fire, a couple of seconds.
#
# Note: GitHub disables scheduled workflows after 60 days of repo inactivity, so
# this backup is itself best-effort. Do not rely on it as the only pinger.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health endpoint
        # Long timeout + retries so a cold start (~50 s) doesn't fail the run.
        run: |
          curl -sSf --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            https://ethara-api-edmu.onrender.com/health
          echo " ping ok $(date -u +%H:%M:%S)"
